name: trade-tariff/process-appendix-5a/week_day

on:
  workflow_dispatch:
  
  schedule:
    - cron: "00 21 * * 1,2,3,4,5"

permissions:
  id-token: write
  contents: read

jobs:
  produce-appendix-5a:
    # Runs on the runner itself, not in a python:3.11.2 container. That image is
    # Debian 11, which is out of support, so apt-get can no longer install jq (the
    # Slack alert needs it). The runner already has jq.
    # The Ubuntu version is pinned because setup-python has no Python 3.11.2 build
    # for newer Ubuntu images, so a move of ubuntu-latest would break this job.
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        environment: 
          - development
          - staging
          - production
        include:
          - environment: development
            aws_bucket_name: "trade-tariff-persistence-844815912454"
            role_arn: "arn:aws:iam::844815912454:role/GithubActions-Appendix5a-Role"
          - environment: staging
            aws_bucket_name: "trade-tariff-persistence-451934005581"
            role_arn: "arn:aws:iam::451934005581:role/GithubActions-Appendix5a-Role"
          - environment: production
            aws_bucket_name: "trade-tariff-persistence-382373577178"
            role_arn: "arn:aws:iam::382373577178:role/GithubActions-Appendix5a-Role"

    env:
      AWS_BUCKET_NAME: ${{ matrix.aws_bucket_name }}

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.role_arn }}
          aws-region: eu-west-2

      - uses: actions/checkout@v4.1.0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.2"

      - name: restore_cache
        uses: actions/cache@v3
        with:
          path: venv
          # A venv holds links to the Python that built it. A venv cached from the old
          # container has links that do not exist on the runner, and python -m venv
          # then fails. A new prefix stops that restore. ci.yml still uses deps-1.0.0.
          key: deps-2.0.0-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            deps-2.0.0-

      - name: Setup environment
        shell: bash
        run: |-
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Run process Script
        shell: bash
        run: |-
          touch .env
          source venv/bin/activate
          python process.py

      - name: Notify Slack on failure
        if: failure()
        uses: trade-tariff/trade-tariff-tools/.github/actions/slack-notify@main
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          channel: tariffs-etl
          color: failure
          message: "The process-appendix-5a workflow has failed for the ${{ matrix.environment }} environment."
